<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CERBERUS NULL architecture</title>
  <desc id="desc">Untrusted observations and planning produce a typed proposal evaluated by the trusted control plane before the protected execution gateway.</desc>
  <rect width="1200" height="620" rx="20" fill="#07111f"/>
  <text x="60" y="62" fill="#f4f8fb" font-family="Inter, Arial" font-size="28" font-weight="700">AUTHORITY IS OUTSIDE THE MODEL</text>
  <rect x="60" y="110" width="300" height="360" rx="18" fill="#0c1b2a" stroke="#31556f"/>
  <text x="210" y="150" text-anchor="middle" fill="#8ba8bd" font-family="ui-monospace, monospace" font-size="14">UNTRUSTED LAYER</text>
  <g fill="#122a3e" stroke="#62a5ff">
    <rect x="100" y="185" width="220" height="54" rx="8"/><rect x="100" y="263" width="220" height="54" rx="8"/><rect x="100" y="341" width="220" height="54" rx="8"/>
  </g>
  <g fill="#f4f8fb" font-family="Inter, Arial" font-size="16" text-anchor="middle">
    <text x="210" y="219">Context + memory</text><text x="210" y="297">Model + planner</text><text x="210" y="375">Typed proposal</text>
  </g>
  <path d="M360 290H430" stroke="#62a5ff" stroke-width="3"/><path d="m420 280 14 10-14 10" fill="none" stroke="#62a5ff" stroke-width="3"/>
  <rect x="440" y="110" width="420" height="430" rx="18" fill="#0a2027" stroke="#42dbc5" stroke-width="2"/>
  <text x="650" y="150" text-anchor="middle" fill="#42dbc5" font-family="ui-monospace, monospace" font-size="14">TRUSTED CONTROL PLANE</text>
  <g fill="#102d35" stroke="#2b6f6b">
    <rect x="480" y="180" width="155" height="52" rx="8"/><rect x="665" y="180" width="155" height="52" rx="8"/>
    <rect x="480" y="252" width="155" height="52" rx="8"/><rect x="665" y="252" width="155" height="52" rx="8"/>
    <rect x="480" y="324" width="155" height="52" rx="8"/><rect x="665" y="324" width="155" height="52" rx="8"/>
    <rect x="480" y="396" width="340" height="76" rx="8"/>
  </g>
  <g fill="#e8f5f3" font-family="Inter, Arial" font-size="15" text-anchor="middle">
    <text x="557" y="212">Identity + mission</text><text x="742" y="212">Capability</text>
    <text x="557" y="284">Provenance</text><text x="742" y="284">Policy</text>
    <text x="557" y="356">Safety + consequence</text><text x="742" y="356">Human approval</text>
    <text x="650" y="426">ALLOW · DENY · REQUIRE_APPROVAL · NULL</text><text x="650" y="452" fill="#8ba8bd">deterministic decision</text>
  </g>
  <path d="M860 290H930" stroke="#42dbc5" stroke-width="3"/><path d="m920 280 14 10-14 10" fill="none" stroke="#42dbc5" stroke-width="3"/>
  <rect x="940" y="160" width="210" height="260" rx="18" fill="#0c1b2a" stroke="#f4f8fb"/>
  <text x="1045" y="203" text-anchor="middle" fill="#8ba8bd" font-family="ui-monospace, monospace" font-size="14">PROTECTED</text>
  <g fill="#122a3e" stroke="#5f7d90"><rect x="980" y="235" width="130" height="50" rx="8"/><rect x="980" y="305" width="130" height="50" rx="8"/></g>
  <g fill="#f4f8fb" font-family="Inter, Arial" font-size="15" text-anchor="middle"><text x="1045" y="266">Gateway</text><text x="1045" y="336">Mock adapters</text></g>
  <path d="M650 540V580H1045V420" fill="none" stroke="#b978ff" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="650" y="594" text-anchor="middle" fill="#bda2d2" font-family="ui-monospace, monospace" font-size="13">HASH-CHAINED EVIDENCE</text>
</svg>
